name: self-checkout

services:
  postgresql:
    image: bitnami/postgresql:17.2.0 
    ports:
      - '5432:5432' 
    environment:
      - POSTGRES_USER=docker 
      - POSTGRES_PASSWORD=docker 
      - POSTGRES_DB=self-checkout
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: