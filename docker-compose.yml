version: '3'

services:
  postgresql:
    image: bitnami/postgresql:17.5.0
    container_name: postgresql
    restart: unless-stopped
    environment:
      - POSTGRESQL_USERNAME=docker
      - POSTGRESQL_PASSWORD=docker
      - POSTGRESQL_DB=selfcheckout
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/bitnami/postgresql

volumes:
  pgdata: